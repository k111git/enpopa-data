# Every 10 minutes: looks for new AROME HD, ICON-EU, EWAM (waves) and SMOC (currents) runs on Open-Meteo,
# cuts the enpopa area out of them (build.mjs) and, when something changed,
# publishes site/ on GitHub Pages.
name: Prepare wind

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # required for enabling the workflow via gh api
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: site
          key: site-${{ github.run_id }}
          restore-keys: site-

      - id: build
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node build.mjs site >> "$GITHUB_OUTPUT"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: site
          key: site-${{ github.run_id }}-${{ github.run_attempt }}

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub can disable scheduled workflows after 60 days without repository activity;
      # re-enabling once a day around 00:03 UTC keeps it active when runs are happening.
      - if: github.event_name == 'schedule' && steps.build.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" \< "0013" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/prepare.yml/enable"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
